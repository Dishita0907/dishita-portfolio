name: Import published portfolio
on:
  push:
    paths:
      - '.github/workflows/import-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import and verify the published site
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f index.html ]]; then exit 0; fi
          mkdir -p images fonts
          curl --fail --silent --show-error --location --retry 3 'https://dishita-kamath.softeft8192.chatgpt.site/Dishita-Kamath-Resume.pdf' -o 'Dishita-Kamath-Resume.pdf'
          echo '421e07712352c5b03e251ce98c50e38b8c2bb06de9939b6538c0f145e5fc59da  Dishita-Kamath-Resume.pdf' | sha256sum --check
          echo '' | base64 -d | gzip -d > 'app.js'
          echo '60685152b9d65f9697a0cc28623bf7e28b1d40fd3280a2a9f7c539d0690d747f  app.js' | sha256sum --check
          echo '' | base64 -d | gzip -d > 'fonts/OFL.txt'
          echo '9e19c0d2e7e7adcbe9dfd0749e34dda41e7e356e0f2cc082d61d2fc9b6e0cef7  fonts/OFL.txt' | sha256sum --check
          curl --fail --silent --show-error --location --retry 3 'https://dishita-kamath.softeft8192.chatgpt.site/fonts/gfs-didot.ttf' -o 'fonts/gfs-didot.ttf'
          echo '4fc784ab824e8866eeef8ad55976b93e7e170fb1b8237fd4f8781b5b4dd297f9  fonts/gfs-didot.ttf' | sha256sum --check
          curl --fail --silent --show-error --location --retry 3 'https://dishita-kamath.softeft8192.chatgpt.site/images/city.jpg' -o 'images/city.jpg'
          echo 'cc481b444c7630af55f482d58c35b391ce96af16f45b1c35394ef809d15097db  images/city.jpg' | sha256sum --check
          curl --fail --silent --show-error --location --retry 3 'https://dishita-kamath.softeft8192.chatgpt.site/images/disco.jpg' -o 'images/disco.jpg'
          echo 'ba1f785636b417aed86de14bce7444cf89235fbae26c0e14714ce0fdb474b3c3  images/disco.jpg' | sha256sum --check
          curl --fail --silent --show-error --location --retry 3 'https://dishita-kamath.softeft8192.chatgpt.site/images/newspaper.jpg' -o 'images/newspaper.jpg'
          echo 'a38fe80c5b300b4ccf4915e6e15b5a502c3d08068743cf834667f5b25b21d2f7  images/newspaper.jpg' | sha256sum --check
          curl --fail --silent --show-error --location --retry 3 'https://dishita-kamath.softeft8192.chatgpt.site/images/reading.jpg' -o 'images/reading.jpg'
          echo 'd96f378a4e95efa8bf6d020f43f406b74e98ba8e97831e3d7fb11059ec309d52  images/reading.jpg' | sha256sum --check
          echo '' | base64 -d | gzip -d > 'index.html'
          echo '231b4ea8d1c85abd9d16f30f1af1885830b17fd06f4bd58151e2bdca1935ea80  index.html' | sha256sum --check
          echo '' | base64 -d | gzip -d > 'style.css'
          echo '0feda2f04b069eeb2186b8e1b0875a5398114ced45f25a7c6602ca5560053d90  style.css' | sha256sum --check
          git add -- index.html app.js style.css fonts images Dishita-Kamath-Resume.pdf
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish Dishita Kamath's portfolio for Vercel"
          git push origin HEAD:main
